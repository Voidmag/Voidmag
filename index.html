<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID MAGAZINE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Helvetica-style alternatives -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

:root {
    --bg: #e8e7e3;
    --black: #0b0b0b;
    --white: #f4f3ef;

    --blue: #0011ff;
    --red: #d90000;
    --green: #aaff00;

    --font: Arial, Helvetica, sans-serif;
    --gap: 1.5rem;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--black);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.2;
    overflow-x: hidden;
    cursor: crosshair;
}

::selection {
    background: var(--green);
    color: var(--black);
}

a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 1.25rem 2rem;

    background: var(--black);
    color: var(--white);

    z-index: 1000;

    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -0.03em;
}

.nav-logo {
    font-size: 1.5rem;
    font-weight: 900;
}

.nav-links {
    display: flex;
    gap: 1.5rem;
    font-size: 0.85rem;
}

.nav-links a:hover {
    color: var(--green);
}


/* =========================================================
   GENERAL
   ========================================================= */

#app {
    padding-top: 80px;
    min-height: 100vh;
}

.view {
    display: none;
    padding: 2rem;
}

.view.active {
    display: block;
}

.section-label {
    font-size: 0.8rem;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 1rem;
}

img {
    display: block;
}


/* =========================================================
   HOMEPAGE
   ========================================================= */

.hero {
    margin-bottom: 7rem;
}

.hero-image {
    width: 100%;
    height: 72vh;
    object-fit: cover;
    filter: grayscale(100%) contrast(1.15);

    transition: filter 0.4s ease;
}

.hero:hover .hero-image {
    filter: grayscale(0%) contrast(1.05);
}

.hero-info {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    margin-top: 1rem;
    gap: 2rem;
}

.hero-meta {
    font-size: 0.85rem;
    font-weight: 900;
    text-transform: uppercase;
}

.hero-title {
    max-width: 1000px;

    font-size: clamp(4rem, 10vw, 10rem);
    font-weight: 900;
    line-height: 0.82;
    letter-spacing: -0.075em;
    text-transform: uppercase;

    margin-top: 0.5rem;
}


/* =========================================================
   LATEST GRID
   ========================================================= */

.latest-heading {
    border-top: 3px solid var(--black);
    padding-top: 0.75rem;
    margin-bottom: 2rem;

    font-size: 1rem;
    font-weight: 900;
    text-transform: uppercase;
}

.editorial-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: var(--gap);

    margin-bottom: 7rem;
}

.article-card {
    display: flex;
    flex-direction: column;
}

.article-card img {
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;

    filter: grayscale(100%) contrast(1.15);

    transition:
        filter 0.3s ease,
        transform 0.4s ease;
}

.article-card:hover img {
    filter: grayscale(0%) contrast(1.05);
    transform: scale(0.99);
}

.article-meta {
    display: flex;
    gap: 1rem;

    margin-top: 0.65rem;

    font-size: 0.72rem;
    font-weight: 900;
    text-transform: uppercase;
}

.article-title {
    margin-top: 0.4rem;

    font-size: clamp(2rem, 4vw, 4.5rem);
    font-weight: 900;
    line-height: 0.86;
    letter-spacing: -0.055em;
    text-transform: uppercase;
}


/* GRID POSITIONS */

.card-1 {
    grid-column: 1 / 8;
}

.card-2 {
    grid-column: 9 / 13;
    margin-top: 12vh;
}

.card-3 {
    grid-column: 2 / 7;
    margin-top: -3vh;
}

.card-4 {
    grid-column: 8 / 13;
    margin-top: 8vh;
}


/* =========================================================
   ABOUT
   ========================================================= */

.about-layout {
    min-height: 70vh;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;
}

.about-text {
    max-width: 1000px;

    font-size: clamp(2.5rem, 6vw, 6rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.06em;
    text-transform: uppercase;
}

.about-instagram {
    display: inline-block;

    margin-top: 3rem;

    font-size: 1rem;
    font-weight: 900;
    text-transform: uppercase;

    border-bottom: 3px solid var(--black);
}

.about-instagram:hover {
    color: var(--blue);
}


/* =========================================================
   ARCHIVE
   ========================================================= */

.archive-header {
    border-bottom: 3px solid var(--black);
    padding-bottom: 1rem;
    margin-bottom: 2rem;

    font-size: clamp(3rem, 8vw, 8rem);
    font-weight: 900;
    line-height: 0.8;
    letter-spacing: -0.07em;
    text-transform: uppercase;
}

.archive-list {
    border-top: 2px solid var(--black);
}

.archive-item {
    display: grid;
    grid-template-columns: 100px 1fr 120px 80px;

    align-items: center;

    gap: 1.5rem;

    padding: 1rem 0;

    border-bottom: 1px solid #aaa;

    transition:
        background 0.2s ease,
        color 0.2s ease;
}

.archive-item:hover {
    background: var(--black);
    color: var(--white);
}

.archive-item img {
    width: 100px;
    height: 65px;

    object-fit: cover;
    filter: grayscale(100%);
}

.archive-title {
    font-size: clamp(1.5rem, 3vw, 3rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.05em;
    text-transform: uppercase;
}

.archive-meta {
    font-size: 0.75rem;
    font-weight: 900;
    text-transform: uppercase;
}


/* =========================================================
   ARTICLE PAGE
   ========================================================= */

.article-layout {
    max-width: 1500px;
    margin: 0 auto;
}

.article-hero {
    width: 100%;
    height: 70vh;

    object-fit: cover;

    filter: grayscale(100%) contrast(1.15);

    margin-bottom: 1.5rem;
}

.article-header {
    border-top: 3px solid var(--black);
    padding-top: 1rem;
}

.article-header-meta {
    display: flex;
    justify-content: space-between;

    font-size: 0.8rem;
    font-weight: 900;
    text-transform: uppercase;
}

.article-h1 {
    max-width: 1300px;

    font-size: clamp(4rem, 10vw, 10rem);
    font-weight: 900;
    line-height: 0.8;

    letter-spacing: -0.075em;
    text-transform: uppercase;

    margin: 1rem 0 5rem;
}

.article-body {
    display: grid;
    grid-template-columns: 2fr 6fr 2fr;

    gap: 2rem;
}

.article-text {
    grid-column: 2;

    font-size: 1.15rem;
    line-height: 1.55;
}

.article-text p {
    margin-bottom: 1.5rem;
}

.article-text strong {
    font-weight: 900;
}

.pull-quote {
    margin: 4rem -10vw;

    font-size: clamp(2.5rem, 5vw, 5rem);
    font-weight: 900;
    line-height: 0.9;
    letter-spacing: -0.05em;
    text-transform: uppercase;

    color: var(--blue);
}

.inline-image {
    width: 140%;

    margin-left: -20%;
    margin-top: 3rem;
    margin-bottom: 3rem;

    filter: grayscale(100%);
}

.inline-image:hover {
    filter: grayscale(0%);
}

.image-caption {
    width: 140%;

    margin-left: -20%;
    margin-top: -2rem;
    margin-bottom: 3rem;

    font-size: 0.7rem;
    font-weight: 900;
    text-transform: uppercase;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 900px) {

    nav {
        padding: 1rem;

        flex-direction: column;
        align-items: flex-start;

        gap: 0.8rem;
    }

    .nav-links {
        width: 100%;

        display: flex;
        flex-wrap: wrap;

        gap: 0.8rem;

        font-size: 0.7rem;
    }

    #app {
        padding-top: 125px;
    }

    .view {
        padding: 1rem;
    }

    .hero {
        margin-bottom: 5rem;
    }

    .hero-image {
        height: 55vh;
    }

    .hero-info {
        display: block;
    }

    .hero-title {
        font-size: 18vw;
    }

    .editorial-grid {
        display: flex;
        flex-direction: column;
        gap: 4rem;
    }

    .card-1,
    .card-2,
    .card-3,
    .card-4 {
        margin-top: 0;
    }

    .article-title {
        font-size: 2.8rem;
    }

    .archive-item {
        grid-template-columns: 70px 1fr;

        gap: 0.75rem;
    }

    .archive-item img {
        width: 70px;
        height: 50px;
    }

    .archive-meta {
        display: none;
    }

    .article-hero {
        height: 50vh;
    }

    .article-h1 {
        font-size: 18vw;
        margin-bottom: 3rem;
    }

    .article-body {
        display: block;
    }

    .article-text {
        font-size: 1rem;
    }

    .pull-quote {
        margin: 3rem 0;

        font-size: 2.8rem;
    }

    .inline-image {
        width: 100%;
        margin-left: 0;
    }

    .image-caption {
        width: 100%;
        margin-left: 0;
    }

}


/* =========================================================
   SMALL ANIMATION
   ========================================================= */

.view.active {
    animation: appear 0.4s ease;
}

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(12px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }

}

</style>
</head>


<body>


<!-- =========================================================
     NAVIGATION
     ========================================================= -->

<nav>

    <div class="nav-logo">
        <a onclick="navigate('home')">
            VOID MAGAZINE
        </a>
    </div>

    <div class="nav-links">

        <a onclick="navigate('home')">Music</a>
        <a onclick="navigate('home')">Fashion</a>
        <a onclick="navigate('home')">Art</a>
        <a onclick="navigate('home')">Culture</a>

        <a onclick="navigate('archive')">
            Archive
        </a>

        <a onclick="navigate('about')">
            About
        </a>

    </div>

</nav>


<div id="app">


<!-- =========================================================
     HOME
     ========================================================= -->

<div id="view-home" class="view active">


    <!-- HERO -->

    <section id="hero"></section>


    <!-- LATEST -->

    <div class="latest-heading">
        Latest
    </div>

    <section
        id="latest-grid"
        class="editorial-grid">
    </section>


</div>



<!-- =========================================================
     ARTICLE
     ========================================================= -->

<div id="view-article" class="view">

    <div
        id="article-container"
        class="article-layout">
    </div>

</div>



<!-- =========================================================
     ARCHIVE
     ========================================================= -->

<div id="view-archive" class="view">

    <div class="archive-header">
        Archive
    </div>

    <div
        id="archive-list"
        class="archive-list">
    </div>

</div>



<!-- =========================================================
     ABOUT
     ========================================================= -->

<div id="view-about" class="view">

    <div class="about-layout">

        <div>

            <div class="about-text">

                VOID MAGAZINE IS AN INDEPENDENT
                PUBLICATION EXPLORING MUSIC,
                FASHION, ART, LIFESTYLE,
                CULTURE AND THE SCENES
                AROUND THEM.

            </div>

            <a
                class="about-instagram"
                href="https://www.instagram.com/voidmaag/"
                target="_blank">

                INSTAGRAM — @VOIDMAAG

            </a>

        </div>

    </div>

</div>


</div>



<script>


/* =========================================================
   =========================================================
   VOIDMAG CONTENT
   =========================================================

   EDIT ARTIKEL DI SINI.

   Kalau mau tambah artikel:

   1. COPY satu blok artikel.
   2. PASTE di bawah artikel terakhir.
   3. Ganti id.
   4. Ganti title.
   5. Ganti category.
   6. Ganti year.
   7. Ganti image.
   8. Ganti description.
   9. Ganti body.

   FOTO:
   Upload foto ke folder:

   images/

   Contoh:

   images/awake-01.jpg

   =========================================================
   ========================================================= */


const ARTICLES = [

    /* =====================================================
       ARTICLE 01 — HERO
       ===================================================== */

    {
        id: "whos-still-awake",

        title: "WHO'S STILL AWAKE?",

        category: "Music / Culture",

        year: "2026",

        image: "images/awake-01.jpg",

        description:
        "A look into the people, places and moments that keep the night moving.",

        body: [

            "WHO'S STILL AWAKE?",

            "This is where the full article text goes. Replace this paragraph with the actual writing from the VOIDMAG post.",

            "Add another paragraph here whenever the story needs it.",

            "The website is designed so you can write as much or as little as you want.",

        ],

        gallery: [

            {
                image: "images/awake-02.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/awake-03.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/awake-04.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/awake-05.jpg",
                caption: "VOIDMAG — 2026."
            }

        ]

    },


    /* =====================================================
       ARTICLE 02
       ===================================================== */

    {
        id: "essential-electronic-albums",

        title: "THE MOST ESSENTIAL ELECTRONIC ALBUMS OF THE 1990s",

        category: "Music",

        year: "2026",

        image: "images/albums-01.jpg",

        description:
        "A selection of records that helped shape electronic music.",

        body: [

            "The 1990s changed the language of electronic music.",

            "From club culture to experimental listening, these records became part of a much larger conversation.",

            "Replace this text with the actual article from your VOIDMAG post."

        ],

        gallery: [

            {
                image: "images/albums-02.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/albums-03.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/albums-04.jpg",
                caption: "VOIDMAG — 2026."
            }

        ]

    },


    /* =====================================================
       ARTICLE 03
       ===================================================== */

    {
        id: "festivals-that-feel-unreal",

        title: "FESTIVALS THAT FEEL UNREAL",

        category: "Culture",

        year: "2026",

        image: "images/festivals-01.jpg",

        description:
        "Images and moments from festivals that feel somewhere between real life and another world.",

        body: [

            "Some festivals feel less like events and more like temporary worlds.",

            "The music is only one part of the experience. The people, architecture, light and atmosphere create something that disappears as quickly as it arrives.",

            "Replace this text with the actual article from your VOIDMAG post."

        ],

        gallery: [

            {
                image: "images/festivals-02.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/festivals-03.jpg",
                caption: "VOIDMAG — 2026."
            },

            {
                image: "images/festivals-04.jpg",
                caption: "VOIDMAG — 2026."
            }

        ]

    },


    /* =====================================================
       ARTICLE 04 — BEN UFO
       ===================================================== */

    {
        id: "ben-ufo",

        title: "BEN UFO: THE UNEXPECTED",

        category: "Music / Profile",

        year: "2026",

        image: "images/ben-ufo-01.jpg",

        description:
        "A profile of one of electronic music's most instinctive selectors.",

        body: [

            "There is a specific kind of tension that builds in a room when Ben UFO is behind the decks.",

            "As one third of Hessle Audio, alongside Pearson Sound and Pangaea, Ben Thomson has built a career around the art of selection.",

            "His sets move between genres without feeling forced, creating a constant sense of uncertainty on the dancefloor.",

            "Replace or expand this text with the final VOIDMAG article."

        ],

        gallery: [

            {
                image: "images/ben-ufo-02.jpg",
                caption: "VOIDMAG — 2026."
            }

        ]

    }

];



/* =========================================================
   FIND ARTICLE
   ========================================================= */

function getArticle(id) {

    return ARTICLES.find(article => article.id === id);

}



/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(viewId, articleId = null) {

    const views =
        document.querySelectorAll(".view");

    views.forEach(view => {
        view.classList.remove("active");
    });


    const target =
        document.getElementById("view-" + viewId);


    if (target) {

        target.classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "instant"
        });

    }


    if (viewId === "article" && articleId) {

        renderArticle(articleId);

    }

}



/* =========================================================
   HERO
   ========================================================= */

function renderHero() {

    const article = ARTICLES[0];

    const hero =
    document.getElementById("hero");


    hero.innerHTML = `

        <a
            class="hero"
            onclick="navigate('article', '${article.id}')">

            <img
                class="hero-image"
                src="${article.image}"
                alt="${article.title}"
            >

            <div class="hero-info">

                <div>

                    <div class="hero-meta">
                        ${article.category}
                    </div>

                    <h1 class="hero-title">
                        ${article.title}
                    </h1>

                </div>

                <div class="hero-meta">
                    ${article.year}
                </div>

            </div>

        </a>

    `;

}



/* =========================================================
   LATEST ARTICLES
   ========================================================= */

function renderLatest() {

    const grid =
        document.getElementById("latest-grid");


    const latest =
        ARTICLES.slice(1);


    grid.innerHTML =
        latest.map((article, index) => {

            const cardClass =
                "article-card card-" + (index + 1);


            return `

                <a
                    class="${cardClass}"
                    onclick="navigate('article', '${article.id}')">

                    <img
                        src="${article.image}"
                        alt="${article.title}"
                    >

                    <div class="article-meta">

                        <span>
                            ${article.category}
                        </span>

                        <span>
                            ${article.year}
                        </span>

                    </div>

                    <div class="article-title">

                        ${article.title}

                    </div>

                </a>

            `;

        }).join("");

}



/* =========================================================
   ARTICLE PAGE
   ========================================================= */

function renderArticle(id) {

    const article =
        getArticle(id);


    if (!article) return;


    const container =
        document.getElementById("article-container");


    const paragraphs =
        article.body.map((paragraph, index) => {

            if (index === 1) {

                return `

                    <div class="pull-quote">
                        ${paragraph}
                    </div>

                `;

            }


            return `
                <p>
                    ${paragraph}
                </p>
            `;

        }).join("");


    const gallery =
        article.gallery.map(item => {

            return `

                <img
                    class="inline-image"
                    src="${item.image}"
                    alt="${article.title}"
                >

                <div class="image-caption">
                    ${item.caption}
                </div>

            `;

        }).join("");


    container.innerHTML = `

        <img
            class="article-hero"
            src="${article.image}"
            alt="${article.title}"
        >


        <div class="article-header">

            <div class="article-header-meta">

                <span>
                    ${article.category}
                </span>

                <span>
                    ${article.year}
                </span>

            </div>


            <h1 class="article-h1">
                ${article.title}
            </h1>

        </div>


        <div class="article-body">

            <div></div>


            <div class="article-text">

                ${paragraphs}

                ${gallery}

            </div>


            <div></div>

        </div>

    `;

}



/* =========================================================
   ARCHIVE
   ========================================================= */

function renderArchive() {

    const archive =
        document.getElementById("archive-list");


    archive.innerHTML =

        ARTICLES.map(article => {

            return `

                <a
                    class="archive-item"
                    onclick="navigate('article', '${article.id}')">

                    <img
                        src="${article.image}"
                        alt="${article.title}"
                    >

                    <div class="archive-title">
                        ${article.title}
                    </div>

                    <div class="archive-meta">
                        ${article.category}
                    </div>

                    <div class="archive-meta">
                        ${article.year}
                    </div>

                </a>

            `;

        }).join("");

}



/* =========================================================
   INITIALIZE
   ========================================================= */

renderHero();

renderLatest();

renderArchive();


</script>

</body>
</html>
