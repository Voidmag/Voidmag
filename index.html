<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID MAGAZINE</title>

<style>

/* =========================================================
   BASIC
   ========================================================= */

:root {
    --bg: #e8e7e3;
    --black: #0a0a0a;
    --white: #f5f5f2;
    --green: #aaff00;

    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--black);
    font-family: var(--font);
    font-weight: 700;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
}

img {
    display: block;
    width: 100%;
}

::selection {
    background: var(--green);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav {

    position: fixed;

    top: 0;
    left: 0;

    width: 100%;

    padding: 20px 25px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: var(--black);
    color: var(--white);

    z-index: 999;

}

.logo {

    font-size: 24px;

    font-weight: 900;

    letter-spacing: -1px;

}

.nav-links {

    display: flex;

    gap: 25px;

    font-size: 13px;

    font-weight: 900;

    text-transform: uppercase;

}

.nav-links a:hover {

    color: var(--green);

}


/* =========================================================
   PAGES
   ========================================================= */

.page {

    display: none;

    padding: 105px 25px 60px;

}

.page.active {

    display: block;

}


/* =========================================================
   HOME / HERO
   ========================================================= */

.hero {

    cursor: pointer;

    margin-bottom: 100px;

}

.hero-photo {

    height: 72vh;

    object-fit: cover;

    filter: contrast(1.2);

    transition: filter .3s ease;

}

.hero:hover .hero-photo {

    filter: grayscale(0%) contrast(1);

}

.hero-bottom {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 20px;

    margin-top: 15px;

}

.meta {

    font-size: 12px;

    font-weight: 900;

    text-transform: uppercase;

}

.hero h1 {

    font-size: clamp(60px, 11vw, 170px);

    line-height: .78;

    letter-spacing: -8px;

    font-weight: 900;

    text-transform: uppercase;

    max-width: 1300px;

    margin-top: 10px;

}


/* =========================================================
   LATEST
   ========================================================= */

.latest-label {

    border-top: 3px solid var(--black);

    padding-top: 10px;

    margin-bottom: 30px;

    font-size: 13px;

    font-weight: 900;

    text-transform: uppercase;

}

#latest {

    display: grid;

    grid-template-columns: repeat(12, 1fr);

    gap: 25px;

    margin-bottom: 100px;

}

.card {

    cursor: pointer;

}

.card-1 {

    grid-column: 1 / 8;

}

.card-2 {

    grid-column: 9 / 13;

    margin-top: 120px;

}

.card-3 {

    grid-column: 2 / 8;

    margin-top: 30px;

}

.card-image {

    background: #d5d4d0;

}

.card-placeholder {

    aspect-ratio: 4 / 3;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 12px;

    font-weight: 900;

    text-transform: uppercase;

}

.card-photo {

    aspect-ratio: 4 / 3;

    object-fit: cover;

    filter: contrast(1.2);

    transition: filter .3s ease;

}

.card:hover .card-photo {

    filter: grayscale(0%);

}

.card .meta {

    margin-top: 10px;

}

.card .meta span {

    margin-left: 15px;

}

.card h2 {

    font-size: clamp(30px, 4vw, 65px);

    line-height: .84;

    letter-spacing: -3px;

    font-weight: 900;

    text-transform: uppercase;

    margin-top: 7px;

}


/* =========================================================
   ARTICLE
   ========================================================= */

.article-cover {

    height: 70vh;

    object-fit: cover;

    filter:  contrast(1.15);

}

.article-placeholder {

    height: 70vh;

    background: #d5d4d0;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 13px;

    font-weight: 900;

    text-transform: uppercase;

}

.article-meta {

    display: flex;

    justify-content: space-between;

    border-top: 3px solid var(--black);

    margin-top: 15px;

    padding-top: 10px;

    font-size: 12px;

    font-weight: 900;

    text-transform: uppercase;

}

.article-title {

    font-size: clamp(55px, 10vw, 150px);

    line-height: .78;

    letter-spacing: -7px;

    font-weight: 900;

    text-transform: uppercase;

    margin: 25px 0 80px;

    max-width: 1400px;

}

.article-writing {

    max-width: 750px;

    margin: auto;

    font-size: 18px;

    line-height: 1.55;

}

.article-writing p {

    margin-bottom: 25px;

}

.article-intro {

    font-size: 42px;

    line-height: .95;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: -2px;

    margin-bottom: 50px;

}

.article-writing figure {

    width: 130%;

    margin: 60px 0 60px -15%;

}

.article-writing figure img {

    width: 100%;

    filter: 

}

.article-writing figure img:hover {

    filter: grayscale(0%);

}

figcaption {

    font-size: 10px;

    font-weight: 900;

    text-transform: uppercase;

    margin-top: 8px;

}

.back {

    max-width: 750px;

    margin: 100px auto 0;

    padding-top: 15px;

    border-top: 3px solid var(--black);

    font-size: 13px;

    font-weight: 900;

    cursor: pointer;

}


/* =========================================================
   ARCHIVE
   ========================================================= */

.archive-heading {

    font-size: clamp(70px, 12vw, 180px);

    line-height: .75;

    letter-spacing: -8px;

    font-weight: 900;

    text-transform: uppercase;

    border-bottom: 3px solid var(--black);

    padding-bottom: 25px;

    margin-bottom: 20px;

}

.archive-item {

    display: grid;

    grid-template-columns: 60px 1fr 150px 70px;

    align-items: center;

    gap: 20px;

    padding: 18px 0;

    border-bottom: 1px solid #aaa;

    cursor: pointer;

}

.archive-item:hover {

    background: var(--black);

    color: var(--white);

}

.archive-number {

    font-size: 11px;

}

.archive-title {

    font-size: 32px;

    line-height: .9;

    font-weight: 900;

    text-transform: uppercase;

    letter-spacing: -1.5px;

}

.archive-meta {

    font-size: 11px;

    font-weight: 900;

    text-transform: uppercase;

}


/* =========================================================
   ABOUT
   ========================================================= */

.about-wrapper {

    min-height: 75vh;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

}

.about-text {

    max-width: 1100px;

    font-size: clamp(40px, 7vw, 100px);

    line-height: .85;

    letter-spacing: -0px;

    font-weight: 900;

    text-transform: uppercase;

}

.instagram {

    display: inline-block;

    margin-top: 40px;

    font-size: 15px;

    font-weight: 900;

    text-transform: uppercase;

    border-bottom: 3px solid var(--black);

}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 800px) {

    nav {

        padding: 15px;

        display: block;

    }

    .logo {

        margin-bottom: 12px;

    }

    .nav-links {

        gap: 12px;

        flex-wrap: wrap;

        font-size: 10px;

    }

    .page {

        padding: 110px 15px 40px;

    }

    .hero-photo {

        height: 55vh;

    }

    .hero h1 {

        font-size: 17vw;

        letter-spacing: -5px;

    }

    #latest {

        display: block;

    }

    .card {

        margin-bottom: 60px;

    }

    .card h2 {

        font-size: 45px;

    }

    .article-cover,
    .article-placeholder {

        height: 50vh;

    }

    .article-title {

        font-size: 17vw;

        letter-spacing: -5px;

    }

    .article-writing {

        font-size: 16px;

    }

    .article-intro {

        font-size: 32px;

    }

    .article-writing figure {

        width: 100%;

        margin-left: 0;

    }

    .archive-item {

        grid-template-columns: 40px 1fr;

        gap: 10px;

    }

    .archive-meta {

        display: none;

    }

    .archive-title {

        font-size: 24px;

    }

}
.site-footer {
    border-top: 2px solid var(--black);
    margin: 80px 25px 25px;
    padding-top: 12px;
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: 10px;
    font-weight: 900;
    text-transform: uppercase;
}

.site-footer div:last-child {
    display: flex;
    gap: 10px;
}

.site-footer a:hover {
    color: var(--green);
}

@media (max-width: 800px) {
    .site-footer {
        margin: 60px 15px 20px;
        flex-direction: column;
        gap: 8px;
    }
}
</style>

</head>


<body>


<!-- =====================================================
     NAVIGATION
     ===================================================== -->

<nav>

    <div class="logo">

        <a onclick="navigate('home')">

        </a>

    </div>


    <div class="nav-links">

        <a onclick="navigate('home')">
            Music
        </a>

        <a onclick="navigate('home')">

        </a>

        </a>

        <a onclick="navigate('home')">

        </a>

        </a>

        <a onclick="navigate('about')">

        </a>

    </div>

</nav>


<!-- =====================================================
     HOME
     ===================================================== -->

<section id="home" class="page active">

    <div id="hero"></div>

    <div class="latest-label">
        Latest
    </div>

    <div id="latest"></div>

</section>


<!-- =====================================================
     ARTICLE
     ===================================================== -->

<section id="article" class="page">

    <div id="article-content"></div>

</section>


<!-- =====================================================
     ARCHIVE
     ===================================================== -->

<section id="archive" class="page">

    <div class="archive-heading">
        Archive
    </div>

    <div id="archive-list"></div>

</section>


<!-- =====================================================
     ABOUT
     ===================================================== -->

<section id="about" class="page">

    <div class="about-wrapper">

        <div>

            <div class="about-text">

                VOID MAGAZINE IS AN INDEPENDENT
                PUBLICATION EXPLORING MUSIC,
                FASHION, ART,
                CULTURE AND THE SCENES
                AROUND THEM.

            </div>

            <a
                class="instagram"
                href="https://www.instagram.com/voidmaag/"
                target="_blank"
            >

                INSTAGRAM — @VOIDMAAG

            </a>

        </div>

    </div>

</section>


<script>

/* =========================================================
   =========================================================
   EDIT ARTIKEL DIDIEEEE NYAKKK
   =========================================================
   
   

   ========================================================= */

const ARTICLES = [

    {
        id: "awake",

        title: "WHO'S STILL AWAKE?",

        category: "Music / Culture",

        year: "2026",

        cover: "awake-1.jpg",

        text: [

            "WHO'S STILL AWAKE?",

            "The night has its own rhythm. Long after the city starts to slow down, another world keeps moving.",

            "Who's still awake? The people behind the decks, the people on the dancefloor, the ones working through the night, and everyone who somehow never went home.",

            "An ongoing look into music, nightlife, spaces, and the people who keep them alive."

        ],

        photos: ["awake-1.jpg", "awake-2.jpg"]
    
    },


    {
        id: "essential-albums",

        title: "THE MOST ESSENTIAL ELECTRONIC ALBUMS OF THE 1990s",

        category: "Music",

        year: "2026",

        cover: "the90s-01.PNG",

        text: [

            "The 1990s changed the language of electronic music.",

            "A decade of experimentation, machines, clubs, labels and records that continue to shape electronic music today.",

            "Dari ambient, techno, house, IDM, hingga dub techno, dekade ini melahirkan berbagai karya yang tidak hanya menawarkan pendekatan baru dalam produksi suara, tetapi juga membentuk bahasa dan identitas baru dalam musik elektronik. Beberapa rilisan bahkan terus menjadi titik referensi bagi generasi setelahnya baik melalui inovasi produksinya, karakter sound, maupun pengaruhnya terhadap perkembangan kultur club dan underground. Empat album dalam versi Void Magazine ini mewakili sebagian kecil dari perubahan tersebut."

        ],

        photos: ["the90s-2.PNG", "the90s-3.PNG", "the90s-4.PNG", "the90s-5.PNG"]

    },


    {
        id: "festivals",

        title: "FESTIVALS THAT FEEL UNREAL",

        category: "Culture",

        year: "2026",

        cover: "fest-01.jpg",

        text: [

            "Some festivals feel less like events and more like temporary worlds.",

            "A collection of places, sounds, crowds and moments that exist for a short time before disappearing.",

            "FULL ARTICLE COMING SOON."

        ],

        photos: []

    },


    {
        id: "ben-ufo",

        title: "BEN UFO: THE UNEXPECTED",

        category: "Music / Profile",

        year: "2026",

        cover: "benufo-1.jpg",

        text: [

            "There is a specific kind of tension that builds in a room when Ben UFO is behind the decks.",

            "A DJ defined less by production and more by selection, instinct and the ability to make a room listen.",

            "FULL ARTICLE COMING SOON."

        ],

        photos: []

    }

];


/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(page, articleID = null) {

    document.querySelectorAll(".page").forEach(function(item) {

        item.classList.remove("active");

    });


    const target =
        document.getElementById(page);


    if (!target) return;


    target.classList.add("active");


    window.scrollTo(0, 0);


    if (page === "article" && articleID) {

        showArticle(articleID);

    }

}


/* =========================================================
   IMAGE
   ========================================================= */

function createImage(article, className) {

    if (!article.cover) {

        return `
            <div class="article-placeholder">
                IMAGE COMING SOON
            </div>
        `;

    }

    return `
        <img
            class="${className}"
            src="${article.cover}"
            alt="${article.title}"
        >
    `;

}


/* =========================================================
   HERO
   ========================================================= */

function createHero() {

    const article =
        ARTICLES[0];


    document.getElementById("hero").innerHTML = `

        <div
            class="hero"
            onclick="navigate('article', '${article.id}')"
        >

            ${createImage(article, "hero-photo")}


            <div class="hero-bottom">

                <div>

                    <div class="meta">
                        ${article.category}
                    </div>

                    <h1>
                        ${article.title}
                    </h1>

                </div>


                <div class="meta">
                    ${article.year}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   LATEST
   ========================================================= */

function createLatest() {

    const container =
        document.getElementById("latest");


    container.innerHTML =
        ARTICLES.slice(1)
        .map(function(article, index) {

            let image;

            if (article.cover) {

                image = `
                    <img
                        class="card-photo"
                        src="${article.cover}"
                        alt="${article.title}"
                    >
                `;

            } else {

                image = `
                    <div class="card-placeholder">
                        IMAGE COMING SOON
                    </div>
                `;

            }


            return `

                <article
                    class="card card-${index + 1}"
                    onclick="navigate('article', '${article.id}')"
                >

                    <div class="card-image">

                        ${image}

                    </div>


                    <div class="meta">

                        ${article.category}

                        <span>
                            ${article.year}
                        </span>

                    </div>


                    <h2>
                        ${article.title}
                    </h2>

                </article>

            `;

        })
        .join("");

}


/* =========================================================
   ARCHIVE
   ========================================================= */

function createArchive() {

    const container =
        document.getElementById("archive-list");


    container.innerHTML =
        ARTICLES.map(function(article, index) {

            return `

                <div
                    class="archive-item"
                    onclick="navigate('article', '${article.id}')"
                >

                    <div class="archive-number">

                        ${String(index + 1).padStart(2, "0")}

                    </div>


                    <div class="archive-title">

                        ${article.title}

                    </div>


                    <div class="archive-meta">

                        ${article.category}

                    </div>


                    <div class="archive-meta">

                        ${article.year}

                    </div>

                </div>

            `;

        })
        .join("");

}


/* =========================================================
   ARTICLE
   ========================================================= */

function showArticle(id) {

    const article =
        ARTICLES.find(function(item) {

            return item.id === id;

        });


    if (!article) return;


    let content = "";


    article.text.forEach(function(paragraph, index) {

        if (index === 0) {

            content += `

                <div class="article-intro">

                    ${paragraph}

                </div>

            `;

        } else {

            content += `

                <p>

                    ${paragraph}

                </p>

            `;

        }

    });


    article.photos.forEach(function(photo) {

        content += `

            <figure>

                <img
                    src="${photo}"
                    alt="${article.title}"
                >

                <figcaption>

                    VOIDMAG — ${article.year}

                </figcaption>

            </figure>

        `;

    });


    document.getElementById("article-content").innerHTML = `

        ${createImage(article, "article-cover")}


        <div class="article-meta">

            <span>
                ${article.category}
            </span>

            <span>
                ${article.year}
            </span>

        </div>


        <h1 class="article-title">

            ${article.title}

        </h1>


        <div class="article-writing">

            ${content}

        </div>


        <div
            class="back"
            onclick="navigate('home')"
        >

            ← BACK TO VOIDMAG

        </div>

    `;

}


/* =========================================================
   START
   ========================================================= */

document.addEventListener("DOMContentLoaded", function() {

    createHero();

    createLatest();

    createArchive();

});

</script>

</footer>
