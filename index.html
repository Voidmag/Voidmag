/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(page, articleID = null) {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");

    window.scrollTo(0, 0);

    if (page === "article" && articleID) {
        showArticle(articleID);
    }
}


/* =========================================================
   HERO
   ========================================================= */

function createHero() {

    const article = ARTICLES[0];

    document.getElementById("hero").innerHTML = `

        <div
            class="hero"
            onclick="navigate('article', '${article.id}')"
        >

            <img
                src="${article.cover}"
                alt="${article.title}"
            >

            <div class="hero-bottom">

                <div>

                    <div class="meta">
                        ${article.category}
                    </div>

                    <h1>
                        ${article.title}
                    </h1>

                </div>

                <div class="meta">
                    ${article.year}
                </div>

            </div>

        </div>

    `;
}


/* =========================================================
   HOME ARTICLES
   ========================================================= */

function createLatest() {

    const container =
        document.getElementById("latest");


    container.innerHTML = ARTICLES
        .slice(1)
        .map((article, index) => `

            <article
                class="card card-${index + 1}"
                onclick="navigate('article', '${article.id}')"
            >

                <img
                    src="${article.cover}"
                    alt="${article.title}"
                >

                <div class="meta">

                    ${article.category}
                    <span>${article.year}</span>

                </div>

                <h2>
                    ${article.title}
                </h2>

            </article>

        `)
        .join("");
}


/* =========================================================
   ARCHIVE
   ========================================================= */

function createArchive() {

    document.getElementById("archive-list").innerHTML =

        ARTICLES.map(article => `

            <div
                class="archive-item"
                onclick="navigate('article', '${article.id}')"
            >

                <img
                    src="${article.cover}"
                    alt="${article.title}"
                >

                <div class="archive-title">
                    ${article.title}
                </div>

                <div class="archive-meta">
                    ${article.category}
                </div>

                <div class="archive-meta">
                    ${article.year}
                </div>

            </div>

        `).join("");
}


/* =========================================================
   ARTICLE PAGE
   ========================================================= */

function showArticle(id) {

    const article =
        ARTICLES.find(item => item.id === id);

    if (!article) return;


    let content = "";


    article.text.forEach((paragraph, index) => {

        if (index === 0) {

            content += `
                <div class="article-intro">
                    ${paragraph}
                </div>
            `;

        } else {

            content += `
                <p>
                    ${paragraph}
                </p>
            `;

        }

    });


    article.photos.forEach(photo => {

        content += `

            <figure>

                <img
                    src="${photo}"
                    alt="${article.title}"
                >

                <figcaption>
                    VOIDMAG — ${article.year}
                </figcaption>

            </figure>

        `;

    });


    document.getElementById("article-content").innerHTML = `

        <img
            class="article-cover"
            src="${article.cover}"
            alt="${article.title}"
        >

        <div class="article-meta">

            <span>
                ${article.category}
            </span>

            <span>
                ${article.year}
            </span>

        </div>

        <h1 class="article-title">
            ${article.title}
        </h1>

        <div class="article-writing">

            ${content}

        </div>

    `;
}


/* =========================================================
   INITIALIZE
   ========================================================= */

createHero();
createLatest();
createArchive();


</script>
