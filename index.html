<style>

/* =========================================================

       ===================================================== */

    {

    {

    {

            "There is a specific kind of tension that builds in a room when Ben UFO is behind the decks.",

/* =========================================================
   END EDIT AREA
   ========================================================= */


/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(page, articleID = null) {

    document.querySelectorAll(".page").forEach(function(item) {
        item.classList.remove("active");
    });

    const target = document.getElementById(page);

    if (!target) return;

    target.classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

    if (page === "article" && articleID) {
        showArticle(articleID);
    }
}


/* =========================================================
   IMAGE HELPER
   ========================================================= */

function imageHTML(article, className) {

    if (!article.cover) {

        return `
            <div class="${className} image-placeholder">
                IMAGE COMING SOON
            </div>
        `;

    }

    return `
        <img
            class="${className}"
            src="${article.cover}"
            alt="${article.title}"
        >
    `;
}


/* =========================================================
   HERO
   ========================================================= */

function createHero() {

    const article = ARTICLES[0];

    document.getElementById("hero").innerHTML = `

        <div
            class="hero"
            onclick="navigate('article', '${article.id}')"
        >

            <div class="hero-image">

                ${imageHTML(article, "hero-photo")}

            </div>

            <div class="hero-bottom">

                <div>

                    <div class="meta">
                        ${article.category}
                    </div>

                    <h1>
                        ${article.title}
                    </h1>

                </div>

                <div class="meta year">
                    ${article.year}
                </div>

            </div>

        </div>
    `;
}


/* =========================================================
   LATEST ARTICLES
   ========================================================= */

function createLatest() {

    const container = document.getElementById("latest");

    container.innerHTML = ARTICLES
        .slice(1)
        .map(function(article, index) {

            return `

                <article
                    class="card card-${index + 1}"
                    onclick="navigate('article', '${article.id}')"
                >

                    <div class="card-image">

                        ${imageHTML(article, "card-photo")}

                    </div>

                    <div class="meta">

                        ${article.category}

                        <span>
                            ${article.year}
                        </span>

                    </div>

                    <h2>
                        ${article.title}
                    </h2>

                </article>

            `;

        })
        .join("");
}


/* =========================================================
   ARCHIVE
   ========================================================= */

function createArchive() {

    const container =
        document.getElementById("archive-list");

    container.innerHTML = ARTICLES
        .map(function(article) {

            return `

                <div
                    class="archive-item"
                    onclick="navigate('article', '${article.id}')"
                >

                    <div class="archive-number">
                        ${String(ARTICLES.indexOf(article) + 1).padStart(2, "0")}
                    </div>

                    <div class="archive-title">
                        ${article.title}
                    </div>

                    <div class="archive-meta">
                        ${article.category}
                    </div>

                    <div class="archive-meta">
                        ${article.year}
                    </div>

                </div>

            `;

        })
        .join("");
}


/* =========================================================
   ARTICLE PAGE
   ========================================================= */

function showArticle(id) {

    const article =
        ARTICLES.find(function(item) {
            return item.id === id;
        });

    if (!article) return;

    let content = "";

    article.text.forEach(function(paragraph, index) {

        if (index === 0) {

            content += `
                <div class="article-intro">
                    ${paragraph}
                </div>
            `;

        } else {

            content += `
                <p>
                    ${paragraph}
                </p>
            `;

        }

    });


    article.photos.forEach(function(photo) {

        content += `

            <figure>

                <img
                    src="${photo}"
                    alt="${article.title}"
                >

                <figcaption>
                    VOIDMAG — ${article.year}
                </figcaption>

            </figure>

        `;

    });


    document.getElementById("article-content").innerHTML = `

        <div class="article-top-image">

            ${imageHTML(article, "article-cover")}

        </div>

        <div class="article-meta">

            <span>
                ${article.category}
            </span>

            <span>
                ${article.year}
            </span>

        </div>

        <h1 class="article-title">
            ${article.title}
        </h1>

        <div class="article-writing">

            ${content}

        </div>

        <div
            class="back"
            onclick="navigate('home')"
        >
            ← BACK TO VOIDMAG
        </div>

    `;
}


/* =========================================================
   START WEBSITE
   ========================================================= */

document.addEventListener("DOMContentLoaded", function() {

    createHero();

    createLatest();

    createArchive();

});


</script>
