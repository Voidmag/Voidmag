<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VOID MAGAZINE</title>

<style>

/* =========================================================
   BASIC
   ========================================================= */

:root {
    --bg: #e8e7e3;
    --black: #0a0a0a;
    --white: #f5f5f2;
    --grey: #d5d4d0;
    --line: #aaa;

    --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--black);
    font-family: var(--font);
    font-weight: 700;
    overflow-x: hidden;
}

a {
    color: inherit;
    text-decoration: none;
    cursor: pointer;
}

img {
    display: block;
    width: 100%;
}

::selection {
    background: var(--black);
    color: var(--white);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 22px 25px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--black);
    color: var(--white);
    z-index: 999;
}

.logo {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -2.5px;
    line-height: .85;
    white-space: nowrap;
}

.nav-links {
    display: flex;
    align-items: center;
    gap: 28px;
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
    white-space: nowrap;
}

.nav-links a {
    position: relative;
}

.nav-links a:hover {
    text-decoration: underline;
    text-underline-offset: 5px;
}


/* =========================================================
   PAGES
   ========================================================= */

.page {
    display: none;
    padding: 120px 25px 60px;
}

.page.active {
    display: block;
}


/* =========================================================
   PAGE HEADING
   ========================================================= */

.page-heading {
    font-size: clamp(70px, 12vw, 180px);
    line-height: .75;
    letter-spacing: -8px;
    font-weight: 900;
    text-transform: uppercase;
    border-bottom: 3px solid var(--black);
    padding-bottom: 25px;
    margin-bottom: 35px;
}


/* =========================================================
   HOME / HERO
   ========================================================= */

.hero {
    cursor: pointer;
    padding-bottom: 15px;
    margin-bottom: 45px;
}

.hero-meta {
    font-size: 15px;
    font-weight: 900;
    text-transform: uppercase;
    margin-bottom: 15px;
}

.hero h1 {
    font-size: clamp(75px, 12vw, 185px);
    line-height: .80;
    letter-spacing: -6px;
    font-weight: 900;
    text-transform: uppercase;
    max-width: 1100px;
}

.hero-year {
    font-size: 19px;
    font-weight: 900;
    margin-top: 15px;
}

.hero:hover h1 {
    text-decoration: underline;
    text-underline-offset: 9px;
}


/* =========================================================
   LATEST LABEL
   ========================================================= */

.latest-label {
    border-top: 1px solid var(--black);
    padding-top: 11px;
    margin-bottom: 30px;
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
}


/* =========================================================
   ARTICLE GRID
   ========================================================= */

.article-grid {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 30px 25px;
    margin-bottom: 100px;
}

.card {
    cursor: pointer;
    min-width: 0;
}

.card-large {
    grid-column: span 7;
}

.card-small {
    grid-column: span 5;
}

.card-half {
    grid-column: span 6;
}

.card-image {
    background: var(--grey);
    overflow: hidden;
}

.card-placeholder {
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
}

.card-photo {
    aspect-ratio: 4 / 3;
    object-fit: cover;
    filter: contrast(1.2);
    transition:
        transform .35s ease,
        filter .35s ease;
}

.card:hover .card-photo {
    transform: scale(1.015);
    filter: contrast(1.05);
}

.card .meta {
    margin-top: 11px;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
}

.card h2 {
    font-size: clamp(30px, 4vw, 64px);
    line-height: .84;
    letter-spacing: -3px;
    font-weight: 900;
    text-transform: uppercase;
    margin-top: 7px;
}

.card:hover h2 {
    text-decoration: underline;
    text-underline-offset: 5px;
}


/* =========================================================
   CATEGORY PAGE
   ========================================================= */

.category-intro {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-bottom: 1px solid var(--black);
    padding-bottom: 10px;
    margin-bottom: 30px;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
}

.category-count {
    opacity: .6;
}


/* =========================================================
   ARTICLE PAGE
   ========================================================= */

.article-cover {
    width: 100%;
    height: 70vh;
    object-fit: cover;
    filter: contrast(1.15);
}

.article-placeholder {
    height: 70vh;
    background: var(--grey);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    text-transform: uppercase;
}

/* === FIX: article-meta === */
.article-meta {
    display: flex;
    justify-content: space-between;
    border-top: 3px solid var(--black);
    margin-top: 18px;
    padding-top: 12px;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.02em;
}

.article-title {
    font-size: clamp(48px, 8vw, 120px);
    line-height: .82;
    letter-spacing: -5px;
    font-weight: 900;
    text-transform: uppercase;
    margin: 28px 0 70px;
    max-width: 1400px;
}

.article-writing {
    max-width: 750px;
    margin: auto;
    font-size: 18px;
    line-height: 1.65;
    font-weight: 500; /* softer body text */
}

.article-writing p {
    margin-bottom: 28px;
}

.article-intro {
    font-size: 42px;
    line-height: .95;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: -2px;
    margin-bottom: 50px;
}

.article-writing figure {
    width: 130%;
    margin: 60px 0 60px -15%;
}

.article-writing figure img {
    width: 100%;
    filter: grayscale(100%);
    transition: filter .3s ease;
}

.article-writing figure img:hover {
    filter: grayscale(0%);
}

figcaption {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.65;
}

    margin: 110px auto 0;
    padding-top: 18px;
    border-top: 1px solid var
